<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>題庫查詢</title>
  <script>
    (function () {
      const theme = localStorage.getItem("theme");
      if (theme === "dark") {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="container">

    <div class="top-bar">
      <h1 id="title"></h1>

      <button id="themeToggle" title="切換日夜模式">
        🌙
      </button>
    </div>

    <div class="tabs">
      <a href="#" class="tab" data-type="zhejiang_TV">
        浙江衛視音綜
      </a>

      <a href="#" class="tab" data-type="new_star">
        新「星」
      </a>

      <a href="#" class="tab" data-type="hun">
        百花殺
      </a>

      <a href="#" class="tab" data-type="singer2026">
        歌手2026
      </a>

      <a href="#" class="tab" data-type="entertainment">
        🎭 內娛
      </a>

      <!-- <a href="#" class="tab" data-type="dog">
        野狗骨頭
      </a> -->

      <!-- <a href="#" class="tab" data-type="chicken">
        肯德基
      </a> -->

      <!-- <a href="#" class="tab" data-type="reasoning">
        開始推理吧
      </a> -->

      <!-- <a href="#" class="tab" data-type="star">
        灿如繁星
      </a> -->

      <!-- <a href="#" class="tab" data-type="earth">
        🌍 地球超新鮮
      </a> -->

    </div>

    <input type="text" id="search" placeholder="搜尋題目、答案（空格可多關鍵字，例如：冠軍 顏色 慶餘年）">

    <p id="count"></p>

    <table>

      <thead>
        <tr id="tableHeader"></tr>
      </thead>

      <tbody id="tableBody"></tbody>

    </table>

  </div>

  <script src="js/script.js"></script>

</body>

</html>
